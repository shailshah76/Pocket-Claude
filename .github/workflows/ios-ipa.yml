# Builds an UNSIGNED iOS app (.ipa) on GitHub's Macs, so no local Xcode or paid
# Apple account is needed. Users sign it with their own Apple ID when installing
# (Sideloadly / AltStore). Runs when a Release is published, or by hand.
name: iOS app (unsigned .ipa)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the .ipa to (empty = build artifact only)
        required: false

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Expo SDK 57 needs Xcode 26.4+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: mobile/ios

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/PocketClaude.xcworkspace \
            -scheme PocketClaude \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PocketClaude.xcarchive" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/PocketClaude.xcarchive/Products/Applications/PocketClaude.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry PocketClaude-iOS-unsigned.ipa Payload
          ls -la "$RUNNER_TEMP/ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: PocketClaude-iOS-unsigned
          path: ${{ runner.temp }}/ipa/PocketClaude-iOS-unsigned.ipa

      - name: Attach to the Release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/ipa/PocketClaude-iOS-unsigned.ipa" --clobber -R "$GITHUB_REPOSITORY"
